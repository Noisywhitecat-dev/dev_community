services:

  mysql:
    image: mysql:8.0
    container_name: dev_community_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: dev_community
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_community:/var/lib/mysql

  redis:
    image: redis:7
    container_name: dev_community_redis
    ports:
      - "6379:6379"

volumes:
  mysql_dev_community: